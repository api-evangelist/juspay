meters:
- name: transactions_processed
  description: Payment transactions orchestrated/processed through Juspay, the primary billing driver (rate negotiated, not public).
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
  - payment_method
  - gateway
- name: refunds_processed
  description: Refunds issued through the platform; instant refunds may carry different economics than standard refunds.
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
  - refund_type
- name: settled_volume
  description: Gross rupee volume settled, against which downstream acquirer/aggregator MDR applies.
  unit: currency
  aggregation: sum
  dimensions:
  - merchant
  - payment_method
principles:
- name: Visibility
  description: Track transaction count and settled volume by payment method and gateway; separate Juspay's orchestration fee from downstream MDR and scheme fees.
- name: Allocation
  description: Attribute payment cost per merchant entity, product line, and payment method so blended cost-per-order is visible to each team.
- name: Optimization
  description: Use smart routing to steer to lower-cost gateways, and account for zero-MDR UPI when shaping method mix and checkout defaults.
- name: Accountability
  description: Review monthly transaction economics against the Juspay agreement and downstream acquirer invoices; watch method-mix shifts that move blended cost.
