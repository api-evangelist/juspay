description: >-
  FinOps view of Juspay spend. Juspay is a payments orchestration and checkout
  platform; cost is not a self-serve subscription but a negotiated commercial
  arrangement per merchant, generally driven by transaction volume and product
  mix (orchestration/routing, checkout, HyperSDK) and layered on top of the
  underlying acquirer/aggregator MDR that actually settles the funds. In India,
  bank-to-bank UPI carries zero MDR by NPCI mandate, so method mix (UPI vs cards
  vs netbanking vs wallets) materially changes blended cost per order. Juspay
  does not publish public per-transaction rates, so no per-unit rates are
  reconciled here.
notes: >-
  Per-transaction and orchestration rates are not reconciled - they are set by
  the Juspay commercial agreement. Model total payments cost as Juspay's
  orchestration/platform fee PLUS the downstream gateway/acquirer MDR and any
  network/scheme fees, and track method mix as a primary cost driver.
